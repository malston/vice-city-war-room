<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice City War Room</title>
<style>
  /* Palette: ocean-at-night, flamingo, pool, stucco, sunset. System fonts only (works offline). */
  :root {
    --ocean: #1c1747;
    --ocean-deep: #130f33;
    --flamingo: #ff5c93;
    --pool: #3fe0cf;
    --stucco: #f7e6c8;
    --sunset: #ff9340;
    --ok: #7be495;
    --bad: #ff6b6b;
    --display: "Arial Black", "Helvetica Neue", Impact, sans-serif;
    --body: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    --mono: Consolas, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.5 var(--body); background: var(--ocean); color: var(--stucco); }
  :focus-visible { outline: 3px solid var(--pool); outline-offset: 2px; }

  /* Hero: the striped sunset is the one memorable thing; everything else stays quiet. */
  header {
    position: relative; overflow: hidden; padding: 36px 32px 28px;
    background: linear-gradient(180deg, var(--ocean-deep) 0%, #3a1c5e 70%, #8a2d6b 100%);
    border-bottom: 4px solid var(--flamingo);
  }
  header::before {
    content: ""; position: absolute; right: 6%; bottom: -70px; width: 260px; height: 260px; border-radius: 50%;
    background: linear-gradient(180deg, var(--sunset), var(--flamingo));
    -webkit-mask: repeating-linear-gradient(180deg, #000 0 14px, transparent 14px 18px);
            mask: repeating-linear-gradient(180deg, #000 0 14px, transparent 14px 18px);
  }
  h1 {
    position: relative; margin: 0; font: italic 900 clamp(34px, 6vw, 64px)/0.95 var(--display);
    letter-spacing: -0.02em; color: var(--stucco); text-shadow: 3px 3px 0 var(--flamingo);
  }
  header p { position: relative; margin: 10px 0 0; max-width: 46ch; color: var(--stucco); opacity: .85; }

  main { display: grid; grid-template-columns: minmax(300px, 380px) 1fr; gap: 28px; padding: 28px 32px 40px; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; padding: 20px 16px 32px; } header { padding: 28px 16px 22px; } }

  h2 { margin: 0 0 10px; font: 700 18px/1.2 var(--display); color: var(--pool); }
  .panel { margin-bottom: 28px; }

  /* Steps: a real sequence, so numbered markers are earned. */
  ol { list-style: none; margin: 0; padding: 0; counter-reset: s; }
  li { counter-increment: s; margin: 0 0 8px; }
  button {
    font: inherit; color: inherit; cursor: pointer; text-align: left;
    transition: background .15s, border-color .15s;
    position: relative; overflow: hidden;
  }
  /* Post-click: chrome shine sweep plus pixel sparks and smoke (see burst()). */
  button.zap::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(110deg, transparent 35%, rgba(255,255,255,.6) 50%, transparent 65%);
    transform: translateX(-100%); animation: shine .6s ease-out;
  }
  @keyframes shine { to { transform: translateX(100%); } }
  /* Flames lick up past the button, so it can't clip like the shine does. */
  button.flame { overflow: visible; }
  button.flame::after {
    content: ""; position: absolute; left: -6%; right: -6%; bottom: 0; height: 240%;
    pointer-events: none; transform-origin: bottom; opacity: 0;
    background:
      radial-gradient(ellipse 18% 70% at 20% 100%, #ffe680, rgba(255,147,64,.85) 35%, transparent 70%),
      radial-gradient(ellipse 22% 95% at 50% 100%, #ffe680, rgba(255,147,64,.85) 35%, rgba(255,92,147,.5) 55%, transparent 75%),
      radial-gradient(ellipse 18% 60% at 80% 100%, #ffe680, rgba(255,147,64,.85) 35%, transparent 70%),
      radial-gradient(ellipse 60% 40% at 50% 100%, rgba(255,92,147,.7), transparent 70%);
    animation: flame 1.1s ease-out;
  }
  @keyframes flame {
    0% { transform: scaleY(0); opacity: 1; }
    30% { transform: scaleY(1); opacity: 1; }
    45% { transform: scaleY(.75); }
    60% { transform: scaleY(1); }
    100% { transform: scaleY(.9); opacity: 0; }
  }
  .spark { position: fixed; z-index: 11; width: 6px; height: 6px; pointer-events: none; }
  .step {
    display: grid; grid-template-columns: 34px 1fr; column-gap: 12px; align-items: center; width: 100%;
    padding: 10px 14px; background: var(--ocean-deep); border: 2px solid #3b3274; border-radius: 4px 14px 4px 14px;
  }
  .step::before {
    content: counter(s); grid-row: span 2; width: 34px; height: 34px; display: grid; place-items: center;
    border-radius: 50%; background: var(--flamingo); color: var(--ocean-deep); font: 900 16px var(--display);
  }
  .step:hover:enabled { border-color: var(--pool); background: #221b57; }
  .step:disabled { opacity: .55; cursor: wait; }
  .step.done { border-color: var(--ok); }
  .step.done::before { content: "\2713"; background: var(--ok); }
  .step.fail { border-color: var(--bad); }
  .step.fail::before { content: "!"; background: var(--bad); }
  .step b { font-weight: 700; }
  .step small { grid-column: 2; opacity: .7; }

  label { display: block; margin: 8px 0 2px; font-size: 14px; opacity: .85; }
  input {
    width: 100%; padding: 8px 10px; font: inherit; color: var(--ocean-deep);
    background: var(--stucco); border: 2px solid transparent; border-radius: 4px;
  }
  .send {
    width: 100%; margin-top: 10px; padding: 10px 14px; font-weight: 700; text-align: center;
    background: var(--pool); color: var(--ocean-deep); border: 0; border-radius: 4px 14px 4px 14px;
  }
  .send:hover:enabled { background: var(--stucco); }
  .send:disabled { opacity: .55; cursor: wait; }

  /* Channel reads like a chat; output is real terminal text, so mono is earned there. */
  #channel { height: 360px; overflow: auto; padding: 14px; background: var(--ocean-deep); border-radius: 6px; border-left: 4px solid var(--flamingo); }
  #channel:empty::before { content: "No messages yet. Start with step 1, then post the kickoff."; opacity: .6; }
  .msg { margin: 0 0 12px; white-space: pre-wrap; max-width: 70ch; }
  .who { display: inline-flex; align-items: center; gap: 6px; vertical-align: middle; }
  .who svg { display: block; flex: none; }
  .msg b { color: var(--sunset); }
  .msg.bot { padding-left: 10px; border-left: 3px solid var(--pool); }
  .msg.bot b { color: var(--pool); }
  .msg i { opacity: .55; font-style: normal; font-size: 13px; }

  pre {
    margin: 0; height: 220px; overflow: auto; padding: 12px; font: 13px/1.5 var(--mono); color: var(--pool);
    background: #0b0924; border-radius: 6px; white-space: pre-wrap;
  }
  /* Clawd in shades: scuttles to whichever button you hover or focus, hops on click. */
  .crab { position: absolute; left: 0; top: 0; z-index: 10; pointer-events: none; transition: transform .7s ease-in-out; }
  .crab svg { display: block; overflow: visible; }
  .crab.walk .a { animation: leg .2s linear infinite; }
  .crab.walk .b { animation: leg .2s linear infinite -.1s; }
  .crab.hop svg { animation: hop .35s ease-out; }
  .crab.mini svg { animation: pop .4s ease-out; }
  @keyframes leg { 50%, 100% { transform: translateY(-1px); } }
  @keyframes hop { 50% { transform: translateY(-12px); } }
  @keyframes pop { from { transform: scale(0); } 60% { transform: scale(1.3) translateY(-6px); } }
  #car { position: fixed; left: 0; top: 0; z-index: 9; pointer-events: none; }
  #car svg { display: block; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } #car { display: none; } }
</style>
</head>
<body>
<header>
  <h1>Vice City War Room</h1>
  <p>Friends reply to one kickoff post. The swarm turns each reply into a launch-day plan.</p>
</header>
<main>
  <div>
    <div class="panel">
      <h2>Run the demo</h2>
      <ol>
        <li><button class="step" data-step="reset"><b>Start clean</b><small>Clear the channel</small></button></li>
        <li><button class="step" data-step="kickoff"><b>Post the kickoff</b><small>Saves the kickoff timestamp</small></button></li>
        <li><button class="step" data-step="seed"><b>Friends reply</b><small>Five fictional people, one per second</small></button></li>
        <li><button class="step" data-step="profiles"><b>Replies become profiles</b><small>Reads the channel and parses each reply</small></button></li>
        <li><button class="step" data-step="swarm" data-fx="flame"><b>Run the swarm and check</b><small>Needs ANTHROPIC_API_KEY and agents set up</small></button></li>
        <li><button class="step" data-step="post" data-fx="flame"><b>Post the plans</b><small>Each plan, then the scoreboard</small></button></li>
      </ol>
    </div>
    <div class="panel">
      <h2>Reply by hand</h2>
      <label for="handle">Handle</label>
      <input id="handle" placeholder="mara" autocomplete="off">
      <label for="text">Reply</label>
      <input id="text" placeholder="Console: PS5" autocomplete="off">
      <button class="send" id="reply">Send reply</button>
    </div>
  </div>
  <div>
    <div class="panel"><h2>Channel</h2><div id="channel" aria-live="polite"></div></div>
    <div class="panel"><h2>Command output</h2><pre id="out">Ready.</pre></div>
  </div>
</main>
<div id="crab" class="crab" aria-hidden="true"><svg viewBox="0 0 16 12" width="48" height="36" shape-rendering="crispEdges">
  <g fill="#d97757">
    <rect x="2" y="2" width="12" height="7"/><rect x="0" y="4" width="2" height="2"/><rect x="14" y="4" width="2" height="2"/>
    <g class="a"><rect x="3" y="9" width="1" height="3"/><rect x="10" y="9" width="1" height="3"/></g>
    <g class="b"><rect x="5" y="9" width="1" height="3"/><rect x="12" y="9" width="1" height="3"/></g>
  </g>
  <g fill="#111"><rect x="3" y="4" width="10" height="1"/><rect x="4" y="4" width="3" height="2"/><rect x="9" y="4" width="3" height="2"/></g>
  <g fill="#fff" opacity=".7"><rect x="4" y="4" width="1" height="1"/><rect x="9" y="4" width="1" height="1"/></g>
</svg></div>
<div id="car" aria-hidden="true"><svg viewBox="0 0 12 20" width="36" height="60" shape-rendering="crispEdges">
  <g fill="#111"><rect x="0" y="3" width="1" height="4"/><rect x="11" y="3" width="1" height="4"/><rect x="0" y="13" width="1" height="4"/><rect x="11" y="13" width="1" height="4"/></g>
  <rect x="2" y="0" width="8" height="1" fill="#e8202a"/><rect x="1" y="1" width="10" height="18" fill="#e8202a"/>
  <rect x="5" y="1" width="2" height="6" fill="#fff" opacity=".8"/>
  <g fill="#ffe680"><rect x="2" y="0" width="2" height="1"/><rect x="8" y="0" width="2" height="1"/></g>
  <g fill="#ff9340"><rect x="2" y="19" width="2" height="1"/><rect x="8" y="19" width="2" height="1"/></g>
  <rect x="2" y="7" width="8" height="2" fill="#3fe0cf" opacity=".7"/>
  <rect x="2" y="9" width="8" height="6" fill="#3a0a10"/>
  <g fill="#d97757"><rect x="3" y="10" width="6" height="4"/><rect x="2" y="9" width="1" height="2"/><rect x="9" y="9" width="1" height="2"/></g>
  <g fill="#111"><rect x="3" y="10" width="6" height="1"/><rect x="4" y="10" width="1" height="2"/><rect x="7" y="10" width="1" height="2"/></g>
</svg></div>
<script>
const $ = (s) => document.querySelector(s);
const $$ = (s) => document.querySelectorAll(s);
const out = $("#out");
const SVGNS = "http://www.w3.org/2000/svg";
// Same crab, different prop. Unknown handles still get one.
const CREW = { jules: "beer", mara: "chips", pia: "soda", otto: "cig", sol: "coffee" };
const KINDS = ["beer", "cig", "soda", "coffee", "chips"];
const PROPS = {
  beer: [[15, 4, 3, 1, "#fff7d0"], [15, 5, 3, 5, "#e8a317"], [18, 6, 1, 2, "#e8a317"]],
  cig: [[15, 5, 1, 1, "#ff9340"], [16, 5, 3, 1, "#f7e6c8"], [19, 5, 1, 1, "#ff3b1f"], [19, 3, 1, 1, "#ddd", ".6"], [20, 2, 1, 1, "#ddd", ".35"]],
  soda: [[17, 1, 1, 2, "#fff"], [15, 3, 3, 1, "#c8c4d4"], [15, 4, 3, 6, "#3fe0cf"], [15, 6, 3, 1, "#fff"]],
  coffee: [[16, 2, 1, 1, "#fff", ".4"], [16, 3, 1, 1, "#fff", ".7"], [15, 5, 3, 4, "#f7e6c8"], [15, 5, 3, 1, "#5c3317"], [18, 6, 1, 2, "#f7e6c8"]],
  chips: [[15, 3, 3, 1, "#ffe680"], [15, 4, 3, 5, "#ff9340"], [16, 6, 1, 1, "#fff7d0"]],
};
function kindFor(handle) {
  if (handle === "war-room") return "";
  if (CREW[handle]) return CREW[handle];
  let n = 0;
  for (const c of handle) n += c.charCodeAt(0);
  return KINDS[n % KINDS.length];
}
function px(x, y, w, h, fill, opacity) {
  const r = document.createElementNS(SVGNS, "rect");
  r.setAttribute("x", x); r.setAttribute("y", y);
  r.setAttribute("width", w); r.setAttribute("height", h);
  r.setAttribute("fill", fill);
  if (opacity) r.setAttribute("opacity", opacity);
  return r;
}
function face(handle) {
  const svg = $("#crab svg").cloneNode(true);
  svg.setAttribute("viewBox", "0 0 22 12");
  svg.setAttribute("width", "44");
  svg.setAttribute("height", "24");
  svg.setAttribute("aria-hidden", "true");
  for (const spec of PROPS[kindFor(handle)] || []) svg.append(px(...spec));
  return svg;
}
let lastChannel = null;

async function refresh() {
  const r = await fetch("/api/channel");
  const d = await r.json();
  if (d.error) { $("#channel").textContent = d.error; return; }
  const box = $("#channel");
  const key = JSON.stringify(d.messages);
  if (key === lastChannel) return;   // nothing new: leave the scroll position alone
  lastChannel = key;
  const wasAtBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
  const keepTop = box.scrollTop;
  box.replaceChildren(...d.messages.map((m) => {
    const el = document.createElement("div");
    el.className = "msg" + (m.handle === "war-room" ? " bot" : "");
    const who = document.createElement("b"); who.textContent = m.name;
    const head = document.createElement("span");
    head.className = "who";
    head.append(face(m.handle), who);
    const t = document.createElement("i"); t.textContent = " " + m.line + "\n";
    el.append(head, t, m.text);   // textContent only, no HTML injection
    return el;
  }));
  // Follow new messages only if the reader was already at the bottom.
  box.scrollTop = wasAtBottom ? box.scrollHeight : keepTop;
}

async function showLiveOutput() {
  try {
    const d = await (await fetch("/api/output")).json();
    if (d.text) {
      out.textContent = d.text;
      out.scrollTop = out.scrollHeight;
    }
  } catch (e) { /* the next poll will try again */ }
}

async function step(name, btn, body = {}) {
  btn.disabled = true;
  out.textContent = "Running...";
  try {
    const r = await fetch("/api/step/" + name, { method: "POST", body: JSON.stringify(body) });
    const d = await r.json();
    out.textContent = d.output;
    btn.classList.remove("done", "fail");
    btn.classList.add(d.ok ? "done" : "fail");
    if (name === "reset") spawnBabies(0);
    if (name === "profiles" && d.ok) spawnBabies(new Set([...$$("#channel .msg:not(.bot) b")].map((b) => b.textContent)).size);
  } catch (e) {
    out.textContent = String(e);
  } finally {
    btn.disabled = false;
    refresh();
  }
}

document.querySelectorAll("button[data-step]").forEach((b) =>
  b.addEventListener("click", () => step(b.dataset.step, b)));
$("#reply").addEventListener("click", (e) =>
  step("reply", e.target, { handle: $("#handle").value.trim(), text: $("#text").value }));

// Always watch the channel and the server's command output, so a reloaded or stale tab still
// shows replies arriving and a running step.
setInterval(refresh, 1000);
setInterval(showLiveOutput, 500);

const crab = $("#crab");
let crabAt = "", crabX = 0, crabY = 0, babies = [];
function march() {
  [crab, ...babies].forEach((c, i) => {
    c.classList.add("walk");
    c.style.transitionDelay = i * 0.12 + "s";
    c.style.transform = `translate(${crabX - i * 26}px, ${crabY + (i ? 18 : 0)}px)`;
  });
}
function scuttle(btn) {
  const r = btn.getBoundingClientRect();
  const to = `${Math.round(r.right + scrollX - 60)},${Math.round(r.top + scrollY - 30)}`;
  if (to === crabAt) return;
  crabAt = to;
  [crabX, crabY] = to.split(",").map(Number);
  march();
}
function spawnBabies(n) {
  babies.forEach((b) => b.remove());
  babies = Array.from({ length: Math.min(n, 8) }, () => {
    const b = crab.cloneNode(true);
    b.removeAttribute("id");
    b.classList.remove("walk", "hop");
    b.classList.add("mini");
    b.querySelector("svg").setAttribute("width", 24);
    b.querySelector("svg").setAttribute("height", 18);
    b.style.transform = `translate(${crabX + 12}px, ${crabY + 18}px)`;
    b.addEventListener("transitionend", () => b.classList.remove("walk"));
    document.body.append(b);
    return b;
  });
  void document.body.offsetWidth;   // commit the spawn spot so they visibly walk out of it
  march();
}
crab.addEventListener("transitionend", () => crab.classList.remove("walk"));
document.querySelectorAll("button").forEach((b) => {
  b.addEventListener("mouseenter", () => scuttle(b));
  b.addEventListener("focus", () => scuttle(b));
  b.addEventListener("click", (e) => {
    scuttle(b);
    crab.classList.remove("hop"); void crab.offsetWidth; crab.classList.add("hop");
    b.classList.remove("zap", "flame"); void b.offsetWidth; b.classList.add(b.dataset.fx || "zap");
    const r = b.getBoundingClientRect();
    burst(e.detail ? e.clientX : r.left + r.width / 2, e.detail ? e.clientY : r.top + r.height / 2, b.dataset.fx ? 2 : 1);
  });
});

const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
function burst(x, y, size) {
  if (reduceMotion) return;
  for (let i = 0; i < 9 * size; i++) {
    const smoke = i % 3 === 2, p = document.createElement("span");
    p.className = "spark";
    p.style.background = smoke ? "#8a86a8" : ["#ffe680", "#ff9340", "#ff5c93"][Math.floor(Math.random() * 3)];
    p.style.left = x - 3 + "px"; p.style.top = y - 3 + "px";
    document.body.append(p);
    const dx = (Math.random() - 0.5) * 70 * size, dy = (-25 - Math.random() * 45) * size;
    p.animate([
      { transform: "translate(0, 0) scale(1)", opacity: smoke ? 0.7 : 1 },
      { transform: `translate(${dx}px, ${dy}px) scale(${smoke ? 3 : 0.4})`, opacity: 0 },
    ], { duration: smoke ? 900 : 500, easing: "ease-out" }).onfinish = () => p.remove();
  }
}
scuttle($(".step"));

const car = $("#car");
const CW = 36, CH = 60, FLEE = 150;
const BREAK_MS = 45000, lapsUntilBreak = () => 3 + Math.floor(Math.random() * 3);
let cx = innerWidth * 0.8, cy = -CH, vx = 0, vy = 140, mx = -1e4, my = -1e4, last = performance.now();
let laps = lapsUntilBreak(), parkedUntil = 0;
addEventListener("mousemove", (e) => { mx = e.clientX; my = e.clientY; });
function drive(t) {
  const dt = Math.min((t - last) / 1000, 0.05);
  last = t;
  if (t < parkedUntil) return requestAnimationFrame(drive);
  const dx = cx + CW / 2 - mx, dy = cy + CH / 2 - my;
  const near = Math.hypot(dx, dy) < FLEE;
  vx += ((near ? Math.sign(dx || 1) * 320 : 0) - vx) * Math.min(1, dt * 8);
  cx += vx * dt;
  const max = innerWidth - CW;
  if (cx <= 0 || cx >= max) {
    cx = Math.min(Math.max(cx, 0), max);
    if (near) vy = Math.sign(dy || 1) * Math.abs(vy);   // pinned against a wall: drive away instead
  }
  cy += vy * dt;
  if ((cy > innerHeight && vy > 0) || (cy < -CH && vy < 0)) {
    vy = -vy;
    if (--laps === 0) {
      laps = lapsUntilBreak();
      parkedUntil = t + BREAK_MS;
      cx = Math.random() * (innerWidth - CW);
    }
  }
  const angle = Math.atan2(vx * 0.3, -vy) * 180 / Math.PI;
  car.style.transform = `translate(${cx}px, ${cy}px) rotate(${angle}deg)`;
  requestAnimationFrame(drive);
}
if (!reduceMotion) requestAnimationFrame(drive);
refresh();
</script>
</body>
</html>
